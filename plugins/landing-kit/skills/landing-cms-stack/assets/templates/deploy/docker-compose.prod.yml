# MẪU (chưa chạy thật trên server): stack production Next + Wagtail + Postgres + Nginx.
# Đặt ở gốc repo. Chạy: docker compose -f docker-compose.prod.yml up -d --build
# Bí mật nằm trong .env cạnh file này (KHÔNG commit), mẫu ở .env.prod.example.
#
# Luồng: Internet -> nginx (TLS) -> web (Next, :3000)  -> cms (gunicorn, :8000) qua mạng nội bộ
#                               -> cms  (/admin, /static, /media do nginx phục vụ thẳng từ volume)
name: site-prod   # đặt tên riêng để không đè stack dev / dự án khác trên cùng máy

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Không publish cổng: chỉ cms nói chuyện với db

  cms:
    build: ./backend
    image: site-cms:${IMAGE_TAG:-prod}
    env_file: ./backend/.env.prod   # DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DATABASE_URL, CMS_SHARED_SECRET...
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cms}
      # Next gọi webhook revalidate qua mạng nội bộ, không ra Internet
      FRONTEND_REVALIDATE_URL: http://web:3000/api/revalidate
    volumes:
      - media:/app/media        # ảnh CMS, nginx phục vụ đọc-only
      - private:/app/private    # đính kèm form, KHÔNG phục vụ công khai
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Migration chạy bằng lệnh riêng khi deploy:
    #   docker compose -f docker-compose.prod.yml run --rm cms python manage.py migrate

  web:
    build: ./frontend
    image: site-web:${IMAGE_TAG:-prod}
    env_file: ./frontend/.env.prod  # CMS_REVALIDATE_SECRET, TURNSTILE_SECRET_KEY...
    environment:
      # Gọi CMS qua mạng nội bộ; KHÔNG dùng NEXT_PUBLIC_* (sẽ bị đóng băng vào bundle lúc build)
      CMS_API_URL: http://cms:8000/api/v1
    volumes:
      # Cache ảnh đã tối ưu của next/image + data cache: giữ qua các lần deploy
      - next_cache:/app/.next/cache
    depends_on:
      cms:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - web
      - cms
    restart: unless-stopped

volumes:
  pgdata:
  media:
  private:
  static:
  next_cache:
