# MẪU Nginx: 2 tên miền, www.example.com (Next) và cms.example.com (admin Wagtail + media).
# Thay tên miền, đường dẫn chứng chỉ. Cân nhắc giới hạn /admin theo IP văn phòng / VPN.

upstream web { server web:3000; keepalive 32; }
upstream cms { server cms:8000; }

server {
  listen 80;
  server_name example.com www.example.com cms.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.example.com example.com;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 12m;   # form liên hệ có đính kèm 10 MB
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # File build có hash: cache vĩnh viễn ở trình duyệt / CDN
  location /_next/static/ {
    proxy_pass http://web;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Webhook revalidate chỉ đến từ mạng nội bộ (cms -> web:3000), chặn từ Internet
  location = /api/revalidate { return 404; }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name cms.example.com;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 25m;   # upload ảnh trong admin

  location /media/ {
    alias /srv/media/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options nosniff;
  }
  location /static/ {
    alias /srv/static/;
    expires 30d;
  }
  # API chỉ dành cho Next gọi nội bộ; không mở ra Internet
  location /api/ { return 404; }

  location / {
    proxy_pass http://cms;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
